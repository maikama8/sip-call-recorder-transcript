services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ:-UTC}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      FASTER_WHISPER_MODEL: ${FASTER_WHISPER_MODEL:-base}
      FASTER_WHISPER_DEVICE: ${FASTER_WHISPER_DEVICE:-cpu}
      FASTER_WHISPER_COMPUTE_TYPE: ${FASTER_WHISPER_COMPUTE_TYPE:-int8}
      DATABASE_URL: sqlite:////data/calls.db
      RECORDINGS_DIR: /data/recordings
      MONITOR_DIR: /var/spool/asterisk/monitor
      CDR_PATH: /var/log/asterisk/cdr-csv/Master.csv
      WATCH_ENABLED: ${WATCH_ENABLED:-true}
      WATCH_INTERVAL_SECONDS: ${WATCH_INTERVAL_SECONDS:-5}
      WATCH_SETTLE_SECONDS: ${WATCH_SETTLE_SECONDS:-5}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
    volumes:
      - call-data:/data
      - asterisk-monitor:/var/spool/asterisk/monitor
      - asterisk-cdr:/var/log/asterisk/cdr-csv
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  call-data:
  asterisk-monitor:
  asterisk-cdr:
