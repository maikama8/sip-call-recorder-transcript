; Record the bridged part of a call and name the file so this service can read
; the parties without a CDR.
;
;   YYYYMMDD-HHMMSS-UNIQUEID-CALLER-CALLEE.wav
;   20261102-143015-1730554215.23-1001-200.wav
;
; When systemname is set in asterisk.conf, UNIQUEID is {systemname}-{epoch}.{seq}
; and the parser still accepts it.
;
; Install: copy this context into /etc/asterisk/extensions_custom.conf
; Reload:  asterisk -rx "dialplan reload"
;
; MixMonitor's command argument is a shell command. Do not put CALLERID(num)
; or CALLERID(name) in it. Asterisk expands ${} when MixMonitor is invoked and
; unescapes ^{VAR} to ${VAR} when the command runs, after the file is closed.
; This example passes no command. The directory watcher notices the closed file.
;
; b     record only while the channel is bridged (skip ringing)
; B(15) play a beep every 15 seconds while recording
; p     would beep once when recording starts

[record-and-dial]
exten => _X.,1,NoOp(Record ${EXTEN} for ${CALLERID(num)})
 same => n,Set(SAFE_CALLER=${FILTER(0-9*#+,${CALLERID(num)})})
 same => n,Set(SAFE_CALLEE=${FILTER(0-9*#+,${EXTEN})})
 same => n,Set(REC_STAMP=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,ExecIf($["${SAFE_CALLER}" = ""]?Set(SAFE_CALLER=unknown))
 same => n,Set(REC_FILE=${REC_STAMP}-${UNIQUEID}-${SAFE_CALLER}-${SAFE_CALLEE})
 same => n,Set(MONITOR_DIR=/var/spool/asterisk/monitor)
 same => n,Set(AUDIOHOOK_INHERIT(MixMonitor)=yes)
 same => n,MixMonitor(${MONITOR_DIR}/${REC_FILE}.wav,bB(15))
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Optional, if you want a hook when the file is closed. Keep the script's
; arguments to Asterisk-generated values such as MIXMONITOR_FILENAME.
; same => n,MixMonitor(${MONITOR_DIR}/${REC_FILE}.wav,bB(15),/usr/local/bin/recording-closed ^{MIXMONITOR_FILENAME})
